<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Kestrel</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: "Inter", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: #0f1117;
      color: #e4e4e7;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 2rem;
    }
    .card {
      text-align: center;
      max-width: 420px;
    }
    h1 {
      font-size: 2.5rem;
      font-weight: 700;
      letter-spacing: -0.03em;
      margin-bottom: 0.5rem;
    }
    .accent { color: #60a5fa; }
    p {
      color: #a1a1aa;
      font-size: 1rem;
      line-height: 1.6;
    }
    .status {
      margin-top: 1.5rem;
      font-size: 0.8rem;
      color: #52525b;
    }
  </style>
</head>
<body>
  <div class="card">
    <h1><span class="accent">Kestrel</span></h1>
    <p>Dual-track opportunity aggregator.<br>Jobs and gigs, ranked and reasoned.</p>
    <div class="status">Phase 0 &mdash; skeleton deployed</div>
  </div>
</body>
</html>
