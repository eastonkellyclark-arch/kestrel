# Kestrel — Scoring weights
#
# The composite score is: hygiene_score * skill_factor
#
# Hygiene weights control the five acceptability dimensions (relative, not summed).
# Skill factor is multiplicative — it scales the hygiene score up or down.

# ── Hygiene dimension weights (additive, relative) ──
degree_posture: 20
freshness: 15
location_fit: 15
seniority_fit: 10
source_quality: 5

# ── Skill factor curve (multiplicative) ──
# factor = skill_floor + (1 - skill_floor) * (skill_score / 100) ^ skill_exponent
# Tune skill_exponent: lower = more generous to partial matches.
# Tune skill_floor: the minimum multiplier when skill_score is 0.
skill_floor: 0.15
skill_exponent: 0.6
