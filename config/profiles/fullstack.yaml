# Experience: ~1 year freelance
experience_years: 1

seniority:
  target: mid-senior
  # Mid and Senior are accepted range — no penalty.
  # Staff/Principal/Director are too senior. Intern/Junior too junior.
  too_senior:
    - staff
    - principal
    - distinguished
    - director
    - vp
    - vice president
    - head of
    - chief
  too_junior:
    - intern
    - internship
    - co-op
    - new grad
    - junior
    - entry level
    - entry-level

dealbreakers:
  - security clearance
  - top secret
  - ts/sci
  - commission only
  - commission-only
  - 1099 only
